name: Docker CI App

on:
  push:
    branches: [ master]
  pull_request:
    branches: [ master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build docker image
        run: docker build --tag l5sod-image:ci .
        
       